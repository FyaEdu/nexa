# Menjalankan NEXA tanpa memasang PHP/Composer/Node.js di komputer.
# Pakai:  docker compose up --build      lalu buka http://localhost:5173
name: nexa

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app                  # kode bisa diedit langsung dari komputer
      - backend_vendor:/app/vendor      # vendor disimpan di volume Docker (lebih cepat)
    environment:
      CI_ENV: development
      NEXA_RESEED: "0"                  # ubah ke "1" untuk mengisi ulang data dummy setiap start
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 120                      # pemasangan pertama bisa beberapa menit

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8080
      VITE_USE_POLLING: "true"          # agar perubahan file terdeteksi di Windows/macOS
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_vendor:
  frontend_node_modules:
